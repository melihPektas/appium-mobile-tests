name: Android Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_URL: https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -q test-compile

  android:
    name: Run on Android emulator
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm install -g appium@3.7.0
          appium driver install uiautomator2@8.7.0

      - name: Download the app under test
        run: mkdir -p apps && curl -sfL -o apps/mda.apk "$APP_URL"

      - name: Resolve Maven dependencies
        run: mvn -B -q dependency:go-offline

      - name: Run tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-tests.sh

      - name: Publish results to job summary
        if: ${{ !cancelled() }}
        run: python3 scripts/summary.py

      - name: Upload reports, screenshots and Appium log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            target/surefire-reports
            target/screenshots
            appium.log
          retention-days: 14
